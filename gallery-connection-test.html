<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery Connection Test • Naileditby_gel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#71304a;--rose:#b35e7d;--pale:#fff4f8;--line:#eed5df;--ink:#563e48;--muted:#977783}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8fb,#fff);font-family:Poppins,sans-serif;color:var(--ink)}
header{text-align:center;padding:38px 16px 18px}h1,h2{font-family:'Playfair Display',serif;color:var(--wine)}h1{font-size:clamp(30px,5vw,48px);margin:0}p{color:var(--muted)}.rule{width:65px;height:3px;background:#c7aa76;margin:18px auto}.gallery{max-width:1200px;margin:26px auto;padding:0 18px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,245px),1fr));gap:18px}.photo{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px #71304a0b}.photo img{display:block;width:100%;aspect-ratio:4/4.8;object-fit:cover}.photo div{padding:13px 15px}.photo h2{font-size:19px;margin:0 0 6px}.photo p{font-size:13px;margin:0;line-height:1.6}.status{max-width:900px;margin:16px auto;padding:12px 16px;border-radius:12px;background:var(--pale);font-size:13px}@media(max-width:560px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 10px 40px}.photo img{aspect-ratio:3/4}.photo div{padding:10px}.photo h2{font-size:15px}}
</style></head><body>
<header><p>NAILEDITBY_GEL ♡</p><h1>Our Nail Gallery</h1><div class="rule"></div><p>A little inspiration from Naileditby_gel — from soft and elegant to fun custom nail art. ♡</p></header>
<div id="status" class="status">Loading published gallery photos from the TEST database…</div>
<main id="gallery" class="gallery"></main>
<script>
(async()=>{
const status=document.getElementById('status'), gallery=document.getElementById('gallery');
try{
 const cfg=window.NAILEDIT_CONFIG;
 if(!cfg?.SUPABASE_URL||!cfg?.SUPABASE_ANON_KEY) throw new Error('TEST Supabase configuration is missing.');
 const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const {data,error}=await sb.from('site_gallery').select('title,caption,alt_text,image_path,display_order').eq('is_published',true).order('display_order').order('created_at');
 if(error) throw error;
 const rows=data||[];
 if(!rows.length){status.textContent='Connection successful. No published gallery photos yet. Publish photos in Content Studio to see them here.';return}
 gallery.innerHTML=rows.map(r=>{
  const url=String(r.image_path||'').startsWith('http')?r.image_path:sb.storage.from('nail-portfolio').getPublicUrl(r.image_path).data.publicUrl;
  const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return '<article class="photo"><img loading="lazy" src="'+safe(url)+'" alt="'+safe(r.alt_text||r.title)+'"><div><h2>'+safe(r.title)+'</h2>'+(r.caption?'<p>'+safe(r.caption)+'</p>':'')+'</div></article>';
 }).join('');
 status.textContent='Connected successfully: showing '+rows.length+' published photo(s) from the TEST Content Studio. This is a connection test page, not yet the main homepage.';
}catch(e){status.textContent='Could not load published gallery: '+(e.message||String(e));}
})();
</script></body></html>
