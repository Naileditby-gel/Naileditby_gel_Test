<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Details • Naileditby_gel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--deep:#6f2944;--wine:#8c3b5b;--soft:#fff4f8;--muted:#8a6874;--line:#ead4dd}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8fb,#fff);font-family:Poppins,sans-serif;color:#513c44}.wrap{max-width:1000px;margin:auto;padding:24px 16px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-family:'Playfair Display',serif;color:var(--deep);font-size:30px}.meta{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(111,41,68,.07);margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:#fff;color:var(--deep);font:600 14px Poppins,sans-serif;text-decoration:none;cursor:pointer}.btn.primary{background:var(--deep);color:#fff;border-color:var(--deep)}.notice{padding:14px;border-radius:14px;background:var(--soft);color:var(--deep);margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.panel{padding:16px;border-radius:16px;border:1px solid var(--line);background:#fffafd;min-width:0}.panel h3{margin:0 0 10px;color:var(--deep);font-size:16px}.detail{margin:7px 0;overflow-wrap:anywhere}.gallery{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.gallery img{width:135px;height:135px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}h1,h2{font-family:'Playfair Display',serif;color:var(--deep)}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:16px}.brand{font-size:26px}.gallery img{width:calc(50% - 6px);height:auto;aspect-ratio:1}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">Naileditby_gel ♡</div><div class="meta">Private Owner Dashboard • Booking Details</div></div><a class="btn" id="backBtn" href="admin.html">← Back to Booking List</a></header>
<div id="message" class="notice">Loading booking details…</div><section id="bookingCard" class="card hidden"></section>
<script>
(function(){
const cfg=window.NAILEDIT_CONFIG||{};const $=id=>document.getElementById(id);
const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const params=new URLSearchParams(location.search);const id=params.get('id');const status=params.get('status')||'pending';
$('backBtn').href='admin.html#bookings-'+encodeURIComponent(status);
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(v){return v==null?'Not set':'₱'+Number(v).toFixed(2)}
async function start(){
 if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){$('message').textContent='Dashboard configuration is missing. Please return to the owner dashboard.';return}
 const {data:sessionData}=await sb.auth.getSession();
 if(!sessionData.session){$('message').innerHTML='Please log in to the owner dashboard first. <a href="admin.html">Return to login</a>';return}
 if(!id){$('message').textContent='No booking was selected. Please return to the booking list.';return}
 const {data:r,error}=await sb.from('bookings').select('*').eq('id',id).single();
 if(error||!r){$('message').textContent='Could not load this booking. It may have been removed, or you may need to return to the list and refresh.';return}
 const remaining=Number(r.total_design_price||0)-Number(r.deposit_amount||0);
 const notes=String(r.notes||'');const match=notes.match(/Selected portfolio look:\s*([^\n\r]+)/i);
 let html='<div class="top"><div><h1 style="margin:0 0 5px">'+esc(r.name||'Customer booking')+'</h1><div class="meta">'+esc(r.appointment_date)+' • '+esc(String(r.appointment_time||'').slice(0,5))+' • '+esc(r.service||'Nail service')+' • '+esc(r.nail_length||'')+'</div></div><span class="btn primary" style="pointer-events:none">'+esc(r.status||'pending').replace(/_/g,' ')+'</span></div>';
 html+='<div class="grid"><section class="panel"><h3>♡ Customer Information</h3><div class="detail"><strong>Name:</strong> '+esc(r.name)+'</div><div class="detail"><strong>Phone:</strong> '+esc(r.phone)+'</div><div class="detail"><strong>Email:</strong> '+esc(r.customer_email||'Not provided')+'</div><div class="detail"><strong>Address:</strong> '+esc(r.customer_address||'Not provided')+'</div></section>';
 html+='<section class="panel"><h3>♡ Appointment Details</h3><div class="detail"><strong>Date:</strong> '+esc(r.appointment_date)+'</div><div class="detail"><strong>Time:</strong> '+esc(String(r.appointment_time||'').slice(0,5))+'</div><div class="detail"><strong>Service:</strong> '+esc(r.service)+'</div><div class="detail"><strong>Nail length:</strong> '+esc(r.nail_length||'Not specified')+'</div><div class="detail"><strong>Requested:</strong> '+(r.created_at?esc(new Date(r.created_at).toLocaleString()):'')+'</div></section></div>';
 html+='<section class="panel" style="margin-top:14px"><h3>♡ Design Inspiration & Notes</h3>';
 if(match)html+='<div class="detail"><strong>Selected portfolio design:</strong> '+esc(match[1].trim())+'</div>';
 html+='<div class="detail">'+esc(notes||'No design notes provided.')+'</div>';
 const inspo=Array.isArray(r.inspo_files)?r.inspo_files:[];
 html+='<div id="inspoGallery" class="gallery">'+(inspo.length?'Loading inspiration photos…':'No client inspiration photos attached.')+'</div></section>';
 html+='<div class="grid"><section class="panel"><h3>♡ Custom Price & Payment</h3><div class="detail"><strong>Total design price:</strong> '+money(r.total_design_price)+'</div><div class="detail"><strong>Required deposit:</strong> '+money(r.deposit_amount)+'</div><div class="detail"><strong>Remaining balance:</strong> '+(r.total_design_price!=null&&r.deposit_amount!=null?money(remaining):'Not set')+'</div><div class="detail"><strong>Payment method:</strong> '+esc(r.payment_method||'Not selected')+'</div><div class="detail"><strong>Payment status:</strong> '+esc(r.deposit_status||'pending')+'</div><div class="detail"><strong>Deadline:</strong> '+(r.payment_deadline?esc(new Date(r.payment_deadline).toLocaleString()):'Not started')+'</div><div class="detail"><strong>Verified at:</strong> '+(r.deposit_verified_at?esc(new Date(r.deposit_verified_at).toLocaleString()):'Not verified')+'</div></section>';
 html+='<section class="panel"><h3>♡ Payment Receipt & Reference</h3><div class="detail"><strong>Reference:</strong> '+esc(r.payment_reference||'Not submitted')+'</div><div class="detail"><strong>Submitted:</strong> '+(r.payment_submitted_at?esc(new Date(r.payment_submitted_at).toLocaleString()):'Not submitted')+'</div><div id="proofLink" class="detail">'+(r.payment_proof_path?'Preparing secure receipt link…':'No receipt submitted.')+'</div></section></div>';
 html+='<section class="panel" style="margin-top:14px"><h3>♡ Customer Links & Notifications</h3><div class="detail">Private booking status link</div><div class="actions"><button class="btn" id="shareStatusLink" '+(!r.access_token?'disabled':'')+'>♡ Share Status Link</button><button class="btn" id="copyStatusLink" '+(!r.access_token?'disabled':'')+'>▣ Copy Status Link</button><button class="btn" id="textCustomer" '+(!r.phone?'disabled':'')+'>✉ Text Customer</button><button class="btn" id="emailCustomer" '+(!r.customer_email?'disabled':'')+'>✉ Email Customer</button></div><div id="notificationMessage" class="notice hidden" style="margin-top:10px"></div></section>';
 html+='<section class="panel" style="margin-top:14px"><h3>♡ Owner Actions</h3><div id="actionMessage" class="notice hidden"></div>';
 if(r.status==='pending'){
   html+='<div class="grid"><label>Total design price (₱)<input class="input" id="editTotalPrice" type="number" min="1" step="0.01" value="'+(r.total_design_price==null?'':esc(r.total_design_price))+'" placeholder="e.g. 650"></label><label>Required deposit (₱)<input class="input" id="editDeposit" type="number" min="1" step="0.01" value="'+(r.deposit_amount==null?'':esc(r.deposit_amount))+'" placeholder="e.g. 200"></label></div>';
   if(!r.payment_deadline)html+='<button class="btn primary" id="assignDepositBtn" style="margin-top:12px">♡ Set Price & Send Payment Instructions</button>';
   else html+='<div class="notice">Price/deposit already assigned. The payment deadline is active.</div>';
   if(r.payment_submitted_at||r.payment_reference||r.payment_proof_path)html+='<button class="btn" id="verifyPaymentBtn" style="margin-top:12px">✓ Verify Received Payment</button>';
   if(r.deposit_status==='paid')html+='<button class="btn primary" id="confirmBookingBtn" style="margin-top:12px">✓ Confirm Booking</button>';
   html+='<button class="btn danger" id="rejectBookingBtn" style="margin-top:12px">Reject Booking</button>';
 }else if(r.status==='confirmed'){
   html+='<button class="btn danger" id="cancelBookingBtn">Cancel Booking</button><button class="btn" id="completeBookingBtn">✓ Mark Completed</button>';
 }else html+='<div class="meta">This booking is '+esc(r.status||'not active')+'. No status actions are available here.</div>';
 html+='</section>';
 if(r.status_reason)html+='<div class="notice"><strong>Status reason:</strong> '+esc(r.status_reason)+'</div>';
 if(r.customer_message)html+='<div class="notice"><strong>Customer message:</strong><br>'+esc(r.customer_message)+'</div>';
 html+='<div class="actions"><a class="btn" href="admin.html#bookings-'+encodeURIComponent(status)+'">← Back to Booking List</a></div>';
 $('bookingCard').innerHTML=html;$('bookingCard').classList.remove('hidden');$('message').classList.add('hidden');
 function notificationMsg(t){const el=$('notificationMessage');if(el){el.textContent=t;el.classList.remove('hidden');}}
 const statusUrl=r.access_token?new URL('booking-status.html',location.href):null;if(statusUrl)statusUrl.searchParams.set('token',r.access_token);
 $('shareStatusLink')?.addEventListener('click',async()=>{if(!statusUrl)return;const message='Hi '+(r.name||'there')+'! 💗 You can check your Naileditby_gel booking status here: '+statusUrl.href+' Please keep this private link for your booking updates. 💅✨';try{if(navigator.share){await navigator.share({title:'Naileditby_gel booking status',text:message,url:statusUrl.href});notificationMsg('Share options opened. 💗');}else{await navigator.clipboard.writeText(message);notificationMsg('Status link and message copied. Paste it into your message to the customer. 💗');}}catch(e){if(e.name!=='AbortError')prompt('Copy this message and send it to the customer:',message);}});
 $('copyStatusLink')?.addEventListener('click',async()=>{if(!statusUrl)return;try{await navigator.clipboard.writeText(statusUrl.href);notificationMsg('Private booking status link copied. 💗');}catch(e){prompt('Copy the customer’s private status link:',statusUrl.href);}});
 $('textCustomer')?.addEventListener('click',()=>{if(!r.phone)return;const name=String(r.name||'there').trim()||'there';const messages={pending:'Hi '+name+'! 💗 We’ve received your booking request at Naileditby_gel. Please check your email for appointment details and updates. Thank you for choosing Naileditby_gel ❤️',confirmed:'Hi '+name+'! 💗 Great news! Your appointment with Naileditby_gel is confirmed. Please check your email for appointment details. See you soon! 💅✨',rejected:'Hi '+name+', we’re sorry, but we’re unable to accommodate your booking request. Please check your email for details. Thank you for understanding. 💗',cancelled:'Hi '+name+', we sincerely apologize, but we need to cancel your booking. Please check your email for details. Thank you for understanding. 💗',completed:'Hi '+name+'! 💗 Thank you for visiting Naileditby_gel! We hope you love your nails. ✨'};const msg=messages[String(r.status||'pending').toLowerCase()]||messages.pending;const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const separator=isIOS?'&':'?';window.location.href='sms:'+String(r.phone).replace(/[^+\d]/g,'')+separator+'body='+encodeURIComponent(msg);});
 $('emailCustomer')?.addEventListener('click',async()=>{const btn=$('emailCustomer');btn.disabled=true;btn.textContent='Sending email…';notificationMsg('Connecting to the email service…');try{const result=await sb.functions.invoke('send-booking-email',{body:{booking_id:id}});if(result.error||!result.data||result.data.success!==true){notificationMsg('Email not sent: '+((result.data&&result.data.error)||(result.error&&result.error.message)||'The email service did not return a success response.'));btn.disabled=false;btn.textContent='✉ Email Customer';return;}notificationMsg('Booking email sent successfully. Ask the customer to check their inbox and spam folder. 💗');btn.textContent='✓ Email Sent';}catch(e){notificationMsg('Email not sent: '+(e&&e.message?e.message:'Could not reach the email service.'));btn.disabled=false;btn.textContent='✉ Email Customer';}});
 async function loadSelectedPortfolioPhoto(){const match=String(r.notes||'').match(/Selected portfolio look:\s*([^\n\r]+)/i);if(!match)return;const title=match[1].trim();const section=[...document.querySelectorAll('.panel')].find(el=>el.textContent.includes('Selected portfolio design'));if(!section)return;try{const {data,error}=await sb.from('portfolio_designs').select('title,image_path').ilike('title',title).limit(1).maybeSingle();if(error||!data||!data.image_path)return;const {data:img}=sb.storage.from('nail-portfolio').getPublicUrl(data.image_path);const box=document.createElement('div');box.style.margin='12px 0';const image=document.createElement('img');image.src=img.publicUrl;image.alt=title+' nail design';image.style.cssText='display:block;width:min(100%,360px);max-height:420px;object-fit:cover;border-radius:16px;border:1px solid #ead4dd';box.appendChild(image);const detail=section.querySelector('.detail');if(detail)detail.appendChild(box);}catch(e){console.warn('Could not load selected portfolio image',e);}}
 loadSelectedPortfolioPhoto();
 function actionMsg(t){const el=$('actionMessage');if(el){el.textContent=t;el.classList.remove('hidden');}}
 async function doAction(action){
   const btnMap={assign:'assignDepositBtn',paid:'verifyPaymentBtn',confirm:'confirmBookingBtn',reject:'rejectBookingBtn',cancel:'cancelBookingBtn',complete:'completeBookingBtn'};
   try{
     if(action==='assign'){
       const total=Number($('editTotalPrice').value),deposit=Number($('editDeposit').value);
       if(!Number.isFinite(total)||total<=0||!Number.isFinite(deposit)||deposit<=0||deposit>total){actionMsg('Enter a valid total price and a deposit greater than zero that does not exceed the total price.');return;}
       if(!confirm('Set total price to ₱'+total.toFixed(2)+' and deposit to ₱'+deposit.toFixed(2)+'? This starts the 30-minute payment deadline.'))return;
       const {error}=await sb.rpc('assign_booking_deposit',{p_booking_id:id,p_total_price:total,p_amount:deposit,p_payment_method:null});
       if(error){actionMsg(error.message);return;}location.reload();return;
     }
     let update={};
     if(action==='paid'){
       if(!r.payment_submitted_at&& !r.payment_reference&&!r.payment_proof_path){actionMsg('The customer must submit payment details or proof before verification.');return;}
       if(r.deposit_amount==null||r.total_design_price==null){actionMsg('Set the total price and deposit first.');return;}
       if(!confirm('Have you checked your actual GCash/bank account and confirmed the funds were received?'))return;
       update={deposit_status:'paid',deposit_verified_at:new Date().toISOString()};
     }else if(action==='confirm'){
       if(r.deposit_status!=='paid'){actionMsg('Verify the customer payment before confirming.');return;}
       if(!(Number(r.total_design_price)>0&&Number(r.deposit_amount)>0&&Number(r.deposit_amount)<=Number(r.total_design_price))){actionMsg('Set a valid total price and deposit first.');return;}
       update={status:'confirmed',status_reason:null,customer_message:'Hi! 💗 Your appointment is confirmed! Your total design price is ₱'+Number(r.total_design_price).toFixed(2)+', and your verified deposit is ₱'+Number(r.deposit_amount).toFixed(2)+'. Remaining balance: ₱'+(Number(r.total_design_price)-Number(r.deposit_amount)).toFixed(2)+'. I’m looking forward to seeing you! 💅✨ Please arrive on time. 🩷'};
     }else if(action==='complete'){
       update={status:'completed',status_reason:null,customer_message:'Hi! 💗 Thank you for coming to Naileditby_gel! Your appointment has been marked completed. 💅✨'};
     }else if(action==='reject'||action==='cancel'){
       const next=action==='reject'?'rejected':'cancelled';
       const reason=prompt('Enter the reason to send to the customer:',action==='reject'?'Unable to accommodate':'Emergency reasons');
       if(!reason)return;
       update={status:next,status_reason:reason,customer_message:action==='reject'?'Hi! We’re sorry, but your booking request has been rejected. Reason: '+reason+'. Please check your booking status for updates. 💗':'Hi! We sincerely apologize, but we need to cancel your booking. Reason: '+reason+'. If you have paid a deposit, please contact Gel. Thank you for understanding. 💗'};
     }else return;
     if(!confirm('Proceed with this booking update?'))return;
     const {error}=await sb.from('bookings').update(update).eq('id',id);
     if(error){actionMsg(error.message);return;}location.reload();
   }catch(e){actionMsg(e&&e.message?e.message:'Something went wrong. Please refresh and try again.');}
 }
 ['assign','paid','confirm','reject','cancel','complete'].forEach(a=>{const el=$( {assign:'assignDepositBtn',paid:'verifyPaymentBtn',confirm:'confirmBookingBtn',reject:'rejectBookingBtn',cancel:'cancelBookingBtn',complete:'completeBookingBtn'}[a]);if(el)el.addEventListener('click',()=>doAction(a));});

 if(inspo.length){const gallery=$('inspoGallery');const urls=[];for(const path of inspo){if(typeof path==='string'&&/^https?:\/\//i.test(path)){urls.push(path);continue;}const bucket='booking-inspo';const {data:img}=await sb.storage.from(bucket).createSignedUrl(path,3600);if(img&&img.signedUrl)urls.push(img.signedUrl);}gallery.innerHTML=urls.length?urls.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="Client inspiration photo"></a>').join(''):'Inspiration photos could not be loaded.';}
 if(r.payment_proof_path){const {data:proof,error:proofError}=await sb.storage.from('booking-payment-proof').createSignedUrl(r.payment_proof_path,3600);$('proofLink').innerHTML=!proofError&&proof&&proof.signedUrl?'<a href="'+esc(proof.signedUrl)+'" target="_blank" rel="noopener">Open payment proof / receipt</a>':'Unable to create secure receipt link.';}
}
start();
})();
</script></main></body></html>
