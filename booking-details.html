<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Details • Naileditby_gel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<style>
:root{--deep:#6f2944;--wine:#8c3b5b;--soft:#fff4f8;--muted:#8a6874;--line:#ead4dd}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8fb,#fff);font-family:Poppins,sans-serif;color:#513c44}.wrap{max-width:1000px;margin:auto;padding:24px 16px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-family:'Playfair Display',serif;color:var(--deep);font-size:30px}.meta{color:var(--muted);font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 12px 35px rgba(111,41,68,.07);margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:11px 16px;background:#fff;color:var(--deep);font:600 14px Poppins,sans-serif;text-decoration:none;cursor:pointer}.btn.primary{background:var(--deep);color:#fff;border-color:var(--deep)}.notice{padding:14px;border-radius:14px;background:var(--soft);color:var(--deep);margin-top:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.panel{padding:16px;border-radius:16px;border:1px solid var(--line);background:#fffafd;min-width:0}.panel h3{margin:0 0 10px;color:var(--deep);font-size:16px}.detail{margin:7px 0;overflow-wrap:anywhere}.gallery{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.gallery img{width:135px;height:135px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}h1,h2{font-family:'Playfair Display',serif;color:var(--deep)}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:16px}.brand{font-size:26px}.gallery img{width:calc(50% - 6px);height:auto;aspect-ratio:1}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="brand">Naileditby_gel ♡</div><div class="meta">Private Owner Dashboard • Booking Details</div></div><a class="btn" id="backBtn" href="admin.html">← Back to Booking List</a></header>
<div id="message" class="notice">Loading booking details…</div><section id="bookingCard" class="card hidden"></section>
<script>
(function(){
const cfg=window.NAILEDIT_CONFIG||{};const $=id=>document.getElementById(id);
const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const params=new URLSearchParams(location.search);const id=params.get('id');const status=params.get('status')||'pending';
$('backBtn').href='admin.html#bookings-'+encodeURIComponent(status);
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(v){return v==null?'Not set':'₱'+Number(v).toFixed(2)}
async function start(){
 if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){$('message').textContent='Dashboard configuration is missing. Please return to the owner dashboard.';return}
 const {data:sessionData}=await sb.auth.getSession();
 if(!sessionData.session){$('message').innerHTML='Please log in to the owner dashboard first. <a href="admin.html">Return to login</a>';return}
 if(!id){$('message').textContent='No booking was selected. Please return to the booking list.';return}
 const {data:r,error}=await sb.from('bookings').select('*').eq('id',id).single();
 if(error||!r){$('message').textContent='Could not load this booking. It may have been removed, or you may need to return to the list and refresh.';return}
 const remaining=Number(r.total_design_price||0)-Number(r.deposit_amount||0);
 const notes=String(r.notes||'');const match=notes.match(/Selected portfolio look:\s*([^\n\r]+)/i);
 let html='<div class="top"><div><h1 style="margin:0 0 5px">'+esc(r.name||'Customer booking')+'</h1><div class="meta">'+esc(r.appointment_date)+' • '+esc(String(r.appointment_time||'').slice(0,5))+' • '+esc(r.service||'Nail service')+' • '+esc(r.nail_length||'')+'</div></div><span class="btn primary" style="pointer-events:none">'+esc(r.status||'pending').replace(/_/g,' ')+'</span></div>';
 html+='<div class="grid"><section class="panel"><h3>♡ Customer Information</h3><div class="detail"><strong>Name:</strong> '+esc(r.name)+'</div><div class="detail"><strong>Phone:</strong> '+esc(r.phone)+'</div><div class="detail"><strong>Email:</strong> '+esc(r.customer_email||'Not provided')+'</div><div class="detail"><strong>Address:</strong> '+esc(r.customer_address||'Not provided')+'</div></section>';
 html+='<section class="panel"><h3>♡ Appointment Details</h3><div class="detail"><strong>Date:</strong> '+esc(r.appointment_date)+'</div><div class="detail"><strong>Time:</strong> '+esc(String(r.appointment_time||'').slice(0,5))+'</div><div class="detail"><strong>Service:</strong> '+esc(r.service)+'</div><div class="detail"><strong>Nail length:</strong> '+esc(r.nail_length||'Not specified')+'</div><div class="detail"><strong>Requested:</strong> '+(r.created_at?esc(new Date(r.created_at).toLocaleString()):'')+'</div></section></div>';
 html+='<section class="panel" style="margin-top:14px"><h3>♡ Design Inspiration & Notes</h3>';
 if(match)html+='<div class="detail"><strong>Selected portfolio design:</strong> '+esc(match[1].trim())+'</div>';
 html+='<div class="detail">'+esc(notes||'No design notes provided.')+'</div>';
 const inspo=Array.isArray(r.inspo_files)?r.inspo_files:[];
 html+='<div id="inspoGallery" class="gallery">'+(inspo.length?'Loading inspiration photos…':'No client inspiration photos attached.')+'</div></section>';
 html+='<div class="grid"><section class="panel"><h3>♡ Custom Price & Payment</h3><div class="detail"><strong>Total design price:</strong> '+money(r.total_design_price)+'</div><div class="detail"><strong>Required deposit:</strong> '+money(r.deposit_amount)+'</div><div class="detail"><strong>Remaining balance:</strong> '+(r.total_design_price!=null&&r.deposit_amount!=null?money(remaining):'Not set')+'</div><div class="detail"><strong>Payment method:</strong> '+esc(r.payment_method||'Not selected')+'</div><div class="detail"><strong>Payment status:</strong> '+esc(r.deposit_status||'pending')+'</div><div class="detail"><strong>Deadline:</strong> '+(r.payment_deadline?esc(new Date(r.payment_deadline).toLocaleString()):'Not started')+'</div><div class="detail"><strong>Verified at:</strong> '+(r.deposit_verified_at?esc(new Date(r.deposit_verified_at).toLocaleString()):'Not verified')+'</div></section>';
 html+='<section class="panel"><h3>♡ Payment Receipt & Reference</h3><div class="detail"><strong>Reference:</strong> '+esc(r.payment_reference||'Not submitted')+'</div><div class="detail"><strong>Submitted:</strong> '+(r.payment_submitted_at?esc(new Date(r.payment_submitted_at).toLocaleString()):'Not submitted')+'</div><div id="proofLink" class="detail">'+(r.payment_proof_path?'Preparing secure receipt link…':'No receipt submitted.')+'</div></section></div>';
 if(r.status_reason)html+='<div class="notice"><strong>Status reason:</strong> '+esc(r.status_reason)+'</div>';
 if(r.customer_message)html+='<div class="notice"><strong>Customer message:</strong><br>'+esc(r.customer_message)+'</div>';
 html+='<div class="actions"><a class="btn" href="admin.html#bookings-'+encodeURIComponent(status)+'">← Back to Booking List</a></div>';
 $('bookingCard').innerHTML=html;$('bookingCard').classList.remove('hidden');$('message').classList.add('hidden');
 if(inspo.length){const gallery=$('inspoGallery');const urls=[];for(const path of inspo){if(typeof path==='string'&&/^https?:\/\//i.test(path)){urls.push(path);continue;}const bucket='booking-inspo';const {data:img}=await sb.storage.from(bucket).createSignedUrl(path,3600);if(img&&img.signedUrl)urls.push(img.signedUrl);}gallery.innerHTML=urls.length?urls.map(u=>'<a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="Client inspiration photo"></a>').join(''):'Inspiration photos could not be loaded.';}
 if(r.payment_proof_path){const {data:proof,error:proofError}=await sb.storage.from('booking-payment-proof').createSignedUrl(r.payment_proof_path,3600);$('proofLink').innerHTML=!proofError&&proof&&proof.signedUrl?'<a href="'+esc(proof.signedUrl)+'" target="_blank" rel="noopener">Open payment proof / receipt</a>':'Unable to create secure receipt link.';}
}
start();
})();
</script></main></body></html>
